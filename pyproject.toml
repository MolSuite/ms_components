[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms_components"
dynamic = ["version"]  # from the git tag, see [tool.setuptools_scm]
description = "PySide6 UI components for MolSuite: smart table, project browser, job monitor, PyMOL dock, steppers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mario S. Valdés-Tresanco" },
    { name = "Mario E. Valdés-Tresanco" },
]
keywords = ["pyside6", "qt", "widgets", "molsuite", "table", "monitor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Environment :: X11 Applications :: Qt",
]

# UI components sit on top of the orchestrator (molsuite_flow) and Qt.
dependencies = [
    "ms_flow>=0.1",
    "PySide6>=6.5",
    "sqlmodel>=0.0.14",
]

[project.optional-dependencies]
# PyMOL dock widget. Heavy/optional — only ms_pymol needs it; import degrades
# gracefully without it. Install with: molsuite_components[pymol]
pymol = ["pymol-open-source>=2.5"]
# Test + development tooling.
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/MolSuite/ms_components"
Issues = "https://github.com/MolSuite/ms_components/issues"

# The release tag is the only version there is: nothing to bump by hand, and
# a tag that does not match the metadata becomes impossible.
[tool.setuptools_scm]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
ms_components = ["*.qss", "ms_table/icons/*.svg", "ms_pymol/icons/*.svg", "ms_dockwidget/resources/icons/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
